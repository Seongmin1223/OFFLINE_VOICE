<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix Assistant</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f7f9fc; --surface:#ffffff; --line:#e6eaf1; --line2:#eef1f6;
    --text:#1f2733; --muted:#6b7787; --primary:#2563eb; --primary-soft:#eef3fe;
    --accent:#1d4ed8;
  }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'Pretendard','Apple SD Gothic Neo','맑은 고딕','Segoe UI',sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ── 헤더 ── */
  header {
    display:flex; align-items:center; gap:12px;
    padding:14px 22px; border-bottom:1px solid var(--line); background:var(--surface);
  }
  .logo {
    width:32px; height:32px; border-radius:9px; background:var(--primary);
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .brand { display:flex; flex-direction:column; line-height:1.3; }
  .brand .name { font-size:15.5px; font-weight:700; letter-spacing:-0.2px; }
  .brand .sub  { font-size:12px; color:var(--muted); }
  .state { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted); }
  .state .dot { width:8px; height:8px; border-radius:50%; background:#22a565; }
  .state .dot.busy { background:var(--primary); }

  /* ── 대화 ── */
  #chat {
    flex:1; overflow-y:auto; padding:30px 0 24px;
    display:flex; flex-direction:column; gap:24px;
  }
  #chat::-webkit-scrollbar { width:10px; }
  #chat::-webkit-scrollbar-thumb { background:#dde3ec; border-radius:8px; }
  .turn { width:100%; max-width:740px; margin:0 auto; padding:0 24px; }

  /* 사용자 메시지 — 오른쪽 옅은 버블 */
  .turn.user { display:flex; justify-content:flex-end; }
  .turn.user .text {
    background:var(--primary-soft); color:#16335f; border:1px solid #dbe6fb;
    padding:11px 15px; border-radius:14px 14px 4px 14px; max-width:80%;
    font-size:15px; line-height:1.6;
  }

  /* 어시스턴트 — 왼쪽, 버블 없이 깔끔한 텍스트/카드 */
  .turn.bot { display:flex; gap:13px; align-items:flex-start; }
  .turn.bot .avatar {
    flex:none; width:28px; height:28px; border-radius:8px; background:var(--primary);
    display:flex; align-items:center; justify-content:center; font-size:14px; margin-top:2px;
  }
  .turn.bot .body { flex:1; min-width:0; }
  .turn.bot .intro { font-size:15px; line-height:1.65; color:var(--text); margin-bottom:12px; font-weight:600; }

  .case {
    display:grid; grid-template-columns:auto 1fr; gap:2px 12px; align-items:baseline;
    padding:12px 14px; margin:8px 0; background:var(--surface);
    border:1px solid var(--line); border-radius:12px;
  }
  .case .cid {
    grid-row:1 / span 2; align-self:center;
    font-family:'SF Mono','Consolas','D2Coding',monospace; font-weight:700; font-size:13.5px;
    color:var(--primary); background:var(--primary-soft); border:1px solid #dbe6fb;
    border-radius:8px; padding:7px 9px; white-space:nowrap;
  }
  .case .meta { color:var(--muted); font-size:12.5px; }
  .case .meta .sol { color:var(--accent); font-weight:600; }
  .case .summary { color:var(--text); font-size:14px; line-height:1.5; }

  .insight {
    margin-top:12px; padding:12px 15px; border-radius:12px;
    background:var(--primary-soft); border:1px solid #dbe6fb; color:#1e3a6e;
    font-size:14px; line-height:1.6;
  }
  .insight::before { content:"💡  "; }

  .typing { display:inline-flex; gap:5px; padding:6px 0; }
  .typing span { width:7px; height:7px; border-radius:50%; background:#c2cdde; animation:blink 1.3s infinite; }
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink { 0%,70%,100%{opacity:.35;} 35%{opacity:1;} }

  /* ── 하단 ── */
  footer { border-top:1px solid var(--line); background:var(--surface); padding:16px 24px; }
  .composer { width:100%; max-width:740px; margin:0 auto; display:flex; align-items:center; gap:12px; }
  .hint { flex:1; color:var(--muted); font-size:13.5px; padding:12px 16px;
    border:1px solid var(--line); border-radius:12px; background:var(--bg); }
  #run-btn {
    border:none; border-radius:12px; padding:12px 22px; font-size:14.5px; font-weight:700;
    color:#fff; background:var(--primary); cursor:pointer; white-space:nowrap;
    transition:background .15s ease;
  }
  #run-btn:hover { background:var(--accent); }
  #run-btn:disabled { background:#aebfd6; cursor:default; }

  /* warmup */
  #warmup-overlay {
    position:fixed; inset:0; z-index:1000; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:rgba(247,249,252,0.94); backdrop-filter:blur(3px); color:var(--text);
  }
  #warmup-overlay.show { display:flex; }
  #warmup-overlay .spinner { width:46px; height:46px; border:3px solid #d8e2f3;
    border-top-color:var(--primary); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #warmup-overlay .msg { font-size:17px; font-weight:700; color:var(--primary); }
  #warmup-overlay .sub { font-size:13px; color:var(--muted); }
</style>
</head>
<body>

<!-- 로딩 화면: 페이지 로드 즉시 표시, 서버가 "ready" 보내면 사라짐 -->
<div id="warmup-overlay" class="show">
  <div class="spinner"></div>
  <div class="msg" id="warmup-msg">시스템 가동 중</div>
  <div class="sub">모델을 메모리에 적재하고 있습니다. 잠시만 기다려 주세요.</div>
</div>

<header>
  <div class="logo">🛠️</div>
  <div class="brand">
    <span class="name">Fix Assistant</span>
    <span class="sub">유지보수 장애 이력 회상</span>
  </div>
  <div class="state"><span class="dot" id="dot"></span><span id="state-text">온라인</span></div>
</header>

<div id="chat"></div>

<footer>
  <div class="composer">
    <div class="hint" id="hint">아래 <b>실행</b>을 누르면 현장 엔지니어의 음성 질의가 입력됩니다.</div>
    <audio id="player" preload="auto" style="display:none;"></audio>
    <button id="run-btn">실행</button>
  </div>
</footer>

<script>
  // ── 데모 음성 자동 재생 ──
  let demoRunning = false;
  let inputMode = "demo";
  const runBtn = document.getElementById("run-btn");
  const player = document.getElementById("player");
  const hint   = document.getElementById("hint");

  function applyInputMode() {
    const isDemo = inputMode === "demo";
    runBtn.style.display = isDemo ? "" : "none";
    runBtn.disabled = !isDemo || demoRunning;
    if (!isDemo) hint.textContent = "마이크 입력 대기 중...";
  }

  async function loadRuntimeMode() {
    try {
      const r = await fetch("/api/v1/runtime/mode", { cache: "no-store" });
      if (r.ok) {
        const d = await r.json();
        inputMode = d.mode || "demo";
      }
    } catch (e) { console.warn(e); }
    applyInputMode();
  }

  async function runNext() {
    if (inputMode !== "demo") return;
    if (demoRunning) return;
    demoRunning = true;
    runBtn.disabled = true; hint.textContent = "🎙️ 음성 질의 입력 중...";
    let demo;
    try {
      const r = await fetch("/api/v1/demo/reserve", { method:"POST" });
      if (!r.ok) throw new Error(await r.text());
      demo = await r.json();
    } catch (e) {
      demoRunning = false;
      hint.textContent = "실행 실패: " + (e.message || e);
      runBtn.disabled = false;
      return;
    }
    try {
      player.src = `${demo.url}?t=${Date.now()}`; player.currentTime = 0;
      await player.play();
      await new Promise(r => player.ended ? r() : player.addEventListener("ended", r, {once:true}));
    } catch (e) { console.warn(e); }
    hint.textContent = "질의가 입력되었습니다.";
    try {
      const r = await fetch("/api/v1/demo/run", { method:"POST" });
      if (!r.ok) throw new Error(await r.text());
    } catch (e) {
      demoRunning = false;
      hint.textContent = "실행 실패: " + (e.message || e);
      runBtn.disabled = false;
    }
  }
  runBtn.addEventListener("click", runNext);

  // ── 렌더 ──
  const chat = document.getElementById("chat");
  let pendingBot = null;
  let statusTurn = null;
  let statusBody = null;
  const scrollDown = () => chat.scrollTop = chat.scrollHeight;
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function showStatus(text) {
    if (!statusTurn) {
      statusTurn = document.createElement("div");
      statusTurn.className = "turn bot";
      statusTurn.innerHTML = `<div class="avatar">🛠️</div><div class="body"></div>`;
      chat.appendChild(statusTurn);
      statusBody = statusTurn.querySelector(".body");
    }
    statusBody.innerHTML = `<div class="intro">${esc(text)}</div>`;
    scrollDown();
  }

  function clearStatus() {
    if (statusTurn) statusTurn.remove();
    statusTurn = null;
    statusBody = null;
  }

  function addUser(text) {
    clearStatus();
    const t = document.createElement("div");
    t.className = "turn user";
    t.innerHTML = `<div class="text">${esc(text)}</div>`;
    chat.appendChild(t);
    const b = document.createElement("div");
    b.className = "turn bot";
    b.innerHTML = `<div class="avatar">🛠️</div><div class="body"><div class="typing"><span></span><span></span><span></span></div></div>`;
    chat.appendChild(b);
    pendingBot = b.querySelector(".body");
    scrollDown();
  }

  function renderBot(text) {
    if (!pendingBot) {
      const b = document.createElement("div");
      b.className = "turn bot";
      b.innerHTML = `<div class="avatar">🛠️</div><div class="body"></div>`;
      chat.appendChild(b);
      pendingBot = b.querySelector(".body");
    }
    const lines = text.split("\n").map(l => l.trim()).filter(Boolean);
    let html = "";
    for (const line of lines) {
      const m = line.match(/^\[case:#(\d+)\]\s+(\S+)\s+(\S+)\s+[—-]\s+(.*)$/);
      if (m) {
        const [, id, date, sol, summary] = m;
        html += `<div class="case"><div class="cid">#${id}</div>`
              + `<div class="meta"><span class="sol">${esc(sol)}</span> · ${esc(date)}</div>`
              + `<div class="summary">${esc(summary)}</div></div>`;
      } else if (line.startsWith("※")) {
        html += `<div class="insight">${esc(line.replace(/^※\s*/, ""))}</div>`;
      } else {
        html += `<div class="intro">${esc(line)}</div>`;
      }
    }
    pendingBot.innerHTML = html || `<div class="typing"><span></span><span></span><span></span></div>`;
    scrollDown();
  }

  // ── WebSocket ──
  const WS_URL = `${location.protocol==="https:"?"wss":"ws"}://${location.host}/ws/avatar`;
  let ws, timer;
  const dot = document.getElementById("dot");
  const stateText = document.getElementById("state-text");

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen  = () => { stateText.textContent = "온라인"; clearTimeout(timer); };
    ws.onclose = () => { stateText.textContent = "재연결 중"; setBusy(false); timer = setTimeout(connect, 2500); };
    ws.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (err) { console.warn(err); } };
  }
  function setBusy(on) { dot.classList.toggle("busy", on); stateText.textContent = on ? "응답 중" : "온라인"; }

  function handle(msg) {
    switch (msg.type) {
      case "user_msg":
        addUser(msg.text || "");
        break;
      case "assistant_msg": renderBot(msg.text || ""); break;
      case "pipeline_status":
        if (msg.text) showStatus(msg.text);
        break;
      case "speaking":
        setBusy(msg.speaking ?? false);
        if (msg.speaking === false) {
          pendingBot = null; demoRunning = false; applyInputMode();
          hint.textContent = inputMode === "demo"
            ? "아래 실행을 누르면 다음 음성 질의가 입력됩니다."
            : "마이크 입력 대기 중...";
        }
        break;
      case "status": applyStatus(msg.state, msg.message); break;
    }
  }
  function applyStatus(state, message) {
    const o = document.getElementById("warmup-overlay");
    const warming = state === "warming";
    o.classList.toggle("show", warming);
    if (message) document.getElementById("warmup-msg").textContent = message;
    runBtn.disabled = warming || inputMode !== "demo" || demoRunning;
    stateText.textContent = warming ? "가동 중" : "온라인";
  }
  loadRuntimeMode();
  connect();
</script>
</body>
</html>
