<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>포비 - 친구야 무슨 얘기 할까?</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background:
      radial-gradient(circle at 15% 20%, #ffe1ec 0%, transparent 40%),
      radial-gradient(circle at 85% 30%, #d8efff 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #fff3d6 0%, transparent 50%),
      linear-gradient(180deg, #fff7f0 0%, #ffe9f0 100%);
    background-attachment: fixed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: '맑은 고딕', 'Apple SD Gothic Neo', 'Quicksand', 'Comic Sans MS', sans-serif;
    color: #5b4a3f;
    overflow: hidden;
    gap: 22px;
    position: relative;
  }

  /* 떠다니는 구름/별 데코 */
  .deco {
    position: absolute;
    font-size: 22px;
    opacity: 0.55;
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
  }
  .deco.s2 { animation-duration: 8s; animation-delay: -2s; }
  .deco.s3 { animation-duration: 7s; animation-delay: -4s; }
  .deco.s4 { animation-duration: 9s; animation-delay: -1s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-12px) rotate(4deg); }
  }

  #title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #title-bear {
    font-size: 38px;
    animation: wiggle 3.6s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-6deg); }
    50%      { transform: rotate(6deg); }
  }
  #title {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 6px;
    color: #b56a4a;
    text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(181,106,74,0.2);
  }
  #subtitle {
    font-size: 13px;
    color: #b56a4a;
    opacity: 0.7;
    margin-top: -8px;
  }

  #visualizer-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  #visualizer-container {
    width: 560px;
    height: 200px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(8px);
    border: 3px solid #ffe1c8;
    border-radius: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 32px 28px;
    box-shadow:
      0 10px 30px rgba(255,170,140,0.2),
      inset 0 0 30px rgba(255,255,255,0.4);
    transition: border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
  }
  #visualizer-container.speaking {
    border-color: #ffb3c8;
    box-shadow:
      0 14px 38px rgba(255,140,170,0.3),
      inset 0 0 40px rgba(255,200,220,0.3);
    transform: translateY(-2px);
  }

  .bar {
    flex: 1;
    max-width: 9px;
    min-width: 5px;
    border-radius: 50px;
    height: 6px;
    opacity: 0.55;
    transition: opacity 0.3s ease;
  }
  #visualizer-container.speaking .bar { opacity: 1; }

  /* 무지개 막대 — 인덱스별 nth-child로 색 분포 */
  .bar:nth-child(6n+1) { background: linear-gradient(to top, #ff9eb5, #ffc1d4); }
  .bar:nth-child(6n+2) { background: linear-gradient(to top, #ffb380, #ffd1a8); }
  .bar:nth-child(6n+3) { background: linear-gradient(to top, #ffe17a, #fff0b8); }
  .bar:nth-child(6n+4) { background: linear-gradient(to top, #9ed7a7, #c5ebcd); }
  .bar:nth-child(6n+5) { background: linear-gradient(to top, #87c7f5, #b9dffa); }
  .bar:nth-child(6n+6) { background: linear-gradient(to top, #c7a3ec, #ddc4f5); }

  #speech-bubble {
    position: relative;
    width: 560px;
    background: #fff;
    border: 3px solid #ffe1c8;
    border-radius: 28px;
    padding: 20px 24px;
    font-size: 16px;
    line-height: 1.7;
    min-height: 64px;
    color: #5b4a3f;
    box-shadow: 0 8px 20px rgba(255,170,140,0.18);
    transition: border-color 0.4s ease;
  }
  /* 말풍선 꼬리(위로) */
  #speech-bubble::before {
    content: '';
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-bottom: 14px solid #ffe1c8;
  }
  #speech-bubble::after {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 12px solid #fff;
  }
  #speech-bubble.speaking {
    border-color: #ffb3c8;
  }
  #speech-bubble.speaking::before { border-bottom-color: #ffb3c8; }

  #status-bar {
    font-size: 12px;
    color: #b56a4a;
    opacity: 0.6;
    display: flex;
    gap: 18px;
    letter-spacing: 0.3px;
  }

  /* ── 로딩 오버레이 (시작 시 모델 warm 완료까지 표시) ── */
  #loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background:
      radial-gradient(circle at 50% 30%, #fff7f0 0%, #ffe9f0 60%, #ffe1ec 100%);
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  #loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  #loading-bear {
    font-size: 72px;
    animation: bear-bounce 1.4s ease-in-out infinite;
  }
  @keyframes bear-bounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-14px) scale(1.06); }
  }
  #loading-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #b56a4a;
    text-shadow: 0 2px 0 #fff;
  }
  #loading-msg {
    font-size: 15px;
    color: #b56a4a;
    opacity: 0.8;
  }
  #loading-dots {
    display: flex;
    gap: 10px;
  }
  #loading-dots span {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #ffb3c8;
    animation: dot-pulse 1.2s ease-in-out infinite;
  }
  #loading-dots span:nth-child(2) { animation-delay: 0.2s; background:#ffd1a8; }
  #loading-dots span:nth-child(3) { animation-delay: 0.4s; background:#9ed7a7; }
  #loading-dots span:nth-child(4) { animation-delay: 0.6s; background:#87c7f5; }
  @keyframes dot-pulse {
    0%, 100% { transform: scale(0.6); opacity: 0.4; }
    50%      { transform: scale(1);   opacity: 1; }
  }

</style>
</head>
<body>

<div id="loading-overlay">
  <div id="loading-bear">🧸</div>
  <div id="loading-title">POBY</div>
  <div id="loading-msg">시스템 가동 중...</div>
  <div id="loading-dots"><span></span><span></span><span></span><span></span></div>
</div>

<span class="deco"      style="top: 8%;  left: 10%;">☁️</span>
<span class="deco s2"   style="top: 14%; right: 12%;">⭐</span>
<span class="deco s3"   style="bottom: 18%; left: 8%;">🌷</span>
<span class="deco s4"   style="bottom: 12%; right: 10%;">☁️</span>
<span class="deco s2"   style="top: 50%; left: 4%;">✨</span>
<span class="deco s3"   style="top: 60%; right: 5%;">💗</span>

<div id="title-wrap">
  <span id="title-bear">🧸</span>
  <span id="title">POBY</span>
</div>
<div id="subtitle">친구야, 오늘은 무슨 이야기 할까?</div>

<div id="visualizer-wrapper">
  <div id="visualizer-container"></div>
</div>

<div id="speech-bubble">안녕! 나는 포비야. 같이 재미있는 이야기 하자~ 🐻</div>

<div id="status-bar">
  <span id="status-ws">🔌 연결하는 중...</span>
  <span id="status-turn">이야기 0번</span>
</div>

<div id="tts-test-bar" style="position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
     display:flex; gap:8px; width:560px; max-width:90vw; z-index:100;">
  <input id="tts-input" type="text" placeholder="포비에게 읽어주고 싶은 말을 적어보세요"
    style="flex:1; padding:12px 16px; border:2px solid #ffe1c8; border-radius:24px;
           background:rgba(255,255,255,0.95); font-size:14px; color:#5b4a3f; outline:none;
           box-shadow:0 6px 18px rgba(255,170,140,0.2);">
  <button id="tts-send"
    style="padding:12px 18px; border:none; border-radius:24px; background:#ffb3c8; color:#fff;
           font-weight:700; cursor:pointer; box-shadow:0 6px 18px rgba(255,140,170,0.35);
           white-space:nowrap;">
    🐻 말 시키기
  </button>
</div>

<script>
  async function sendTtsTest() {
    const input = document.getElementById("tts-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    try {
      await fetch("/api/v1/tts/test", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text: text})
      });
    } catch (e) {
      console.error("[TTS test] 전송 실패", e);
    }
  }
  document.getElementById("tts-send").addEventListener("click", sendTtsTest);
  document.getElementById("tts-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendTtsTest();
  });
</script>

<script>
const BAR_COUNT = 56;
const MAX_HEIGHT = 120;
const MIN_HEIGHT = 6;

const container = document.getElementById("visualizer-container");
const bars = [];
for (let i = 0; i < BAR_COUNT; i++) {
  const bar = document.createElement("div");
  bar.className = "bar";
  container.appendChild(bar);
  bars.push(bar);
}

let isSpeaking = false;
let targets = new Array(BAR_COUNT).fill(MIN_HEIGHT);
let currents = new Array(BAR_COUNT).fill(MIN_HEIGHT);

// 서버에서 받은 실제 오디오 프레임 큐
let frameQueue = [];
let activeStream = null;  // { frames, fps, startedAt }

function pickRealFrame(ts) {
  while (true) {
    if (!activeStream) {
      if (frameQueue.length === 0) return false;
      activeStream = frameQueue.shift();
      activeStream.startedAt = ts;
    }
    const elapsedSec = (ts - activeStream.startedAt) / 1000;
    const idx = Math.floor(elapsedSec * activeStream.fps);
    if (idx >= activeStream.frames.length) {
      activeStream = null;
      continue;
    }
    const frame = activeStream.frames[idx];
    // 프레임 자체의 max로 또 한 번 정규화 → 작은 청크도 확실히 솟게
    let frameMax = 0;
    for (let i = 0; i < BAR_COUNT; i++) {
      const v = frame[i] ?? 0;
      if (v > frameMax) frameMax = v;
    }
    const scale = frameMax > 0.05 ? 1.0 / frameMax : 1.0;
    for (let i = 0; i < BAR_COUNT; i++) {
      const v = Math.min((frame[i] ?? 0) * scale, 1.0);
      targets[i] = MIN_HEIGHT + v * (MAX_HEIGHT - MIN_HEIGHT);
    }
    return true;
  }
}

let lastIdleUpdate = 0;
function genIdleTargets(ts) {
  // 잔잔한 호흡 패턴 (살짝 더 부드럽고 작게)
  const phase = ts * 0.0014;
  for (let i = 0; i < BAR_COUNT; i++) {
    const wave = Math.sin(phase + i * 0.23) * 0.5 + 0.5;
    targets[i] = MIN_HEIGHT + wave * 8;
  }
}

function animate(ts) {
  if (!ts) ts = performance.now();

  const drivenByAudio = pickRealFrame(ts);
  if (!drivenByAudio) {
    if (ts - lastIdleUpdate > 50) {
      lastIdleUpdate = ts;
      genIdleTargets(ts);
    }
  }

  const lerp = drivenByAudio ? 0.55 : 0.08;
  for (let i = 0; i < BAR_COUNT; i++) {
    currents[i] += (targets[i] - currents[i]) * lerp;
    bars[i].style.height = currents[i].toFixed(1) + "px";
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function setSpeaking(state) {
  isSpeaking = state;
  container.classList.toggle("speaking", state);
  if (!state) {
    frameQueue.length = 0;
    activeStream = null;
  }
}

function pushAudioFrames(frames, fps) {
  frameQueue.push({ frames, fps: fps || 30, startedAt: 0 });
}

// ── WebSocket ─────────────────────────────────────────────
const WS_URL = "ws://localhost:8000/ws/avatar";
let ws, reconnectTimer;

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    const el = document.getElementById("status-ws");
    el.textContent = "💖 포비랑 연결됐어요";
    clearTimeout(reconnectTimer);
  };

  ws.onclose = () => {
    const el = document.getElementById("status-ws");
    el.textContent = "💤 포비가 잠시 쉬는 중...";
    setSpeaking(false);
    reconnectTimer = setTimeout(connect, 3000);
  };

  ws.onmessage = (event) => {
    try {
      const msg = JSON.parse(event.data);
      handleMessage(msg);
    } catch (e) {
      console.warn("[WS] 파싱 실패:", e);
    }
  };
}

function handleMessage(msg) {
  switch (msg.type) {
    case "speaking":
      const speaking = msg.speaking ?? msg.is_speaking ?? false;
      setSpeaking(speaking);
      if (msg.text) updateSpeechBubble(msg.text);
      document.getElementById("speech-bubble").classList.toggle("speaking", speaking);
      break;

    case "audio_frames":
      if (Array.isArray(msg.frames)) {
        pushAudioFrames(msg.frames, msg.fps);
      }
      break;

    case "state":
      document.getElementById("status-turn").textContent = `이야기 ${msg.turn || 0}번`;
      break;

    case "llm":
      updateSpeechBubble(msg.text);
      break;

    case "stt":
      console.log("[친구]", msg.text);
      break;

    case "status":
      handleStatus(msg);
      break;
  }
}

function handleStatus(msg) {
  const overlay = document.getElementById("loading-overlay");
  const msgEl = document.getElementById("loading-msg");
  if (msg.message) msgEl.textContent = msg.message;
  if (msg.state === "ready") {
    overlay.classList.add("hidden");
  } else {
    overlay.classList.remove("hidden");
  }
}

function updateSpeechBubble(text) {
  document.getElementById("speech-bubble").textContent = text;
}

connect();
</script>

<script>
// ── 데모 모드 전용 트리거 ──────────────────────────────────
// 서버가 demo 모드일 때만 "데모 실행" 버튼 표시. 클릭 시 녹음된 아동 질문
// 음성을 먼저 들려주고(시연 영상용), 끝나면 동일 파일을 파이프라인에 투입.
(async function setupDemo() {
  let mode;
  try {
    mode = await (await fetch("/api/v1/runtime/mode")).json();
  } catch (e) { return; }
  if (!mode || !mode.demo_enabled) return;

  const btn = document.createElement("button");
  btn.textContent = "▶ 데모 실행";
  btn.style.cssText =
    "position:fixed; left:24px; bottom:24px; z-index:200; padding:12px 20px;" +
    "border:none; border-radius:24px; background:#87c7f5; color:#fff; font-weight:700;" +
    "font-size:14px; cursor:pointer; box-shadow:0 6px 18px rgba(135,199,245,0.45);";
  document.body.appendChild(btn);

  let running = false;
  btn.addEventListener("click", async () => {
    if (running) return;
    running = true; btn.disabled = true; btn.textContent = "▶ 재생 중...";
    const release = () => { running = false; btn.disabled = false; btn.textContent = "▶ 데모 실행"; };
    try {
      const r = await (await fetch("/api/v1/demo/reserve", { method: "POST" })).json();
      const triggerRun = async () => {
        try { await fetch("/api/v1/demo/run", { method: "POST" }); } catch (e) {}
      };
      const a = new Audio(r.url);
      a.onended = triggerRun;
      a.onerror = triggerRun;
      a.play().catch(triggerRun);
    } catch (e) {
      console.error("[데모] 실패", e);
    } finally {
      // 파이프라인 완료(speaking:false)는 별도로 들어오므로 버튼은 잠시 후 해제
      setTimeout(release, 2500);
    }
  });
})();
</script>
</body>
</html>
